<app-drag-and-drop title="Excluir registro" (closedDialog)="close(false)"></app-drag-and-drop>

<div class="delete-body">
  <p>Essa ação não pode ser desfeita. Deseja realmente excluir este registro?</p>

  <div class="delete-actions">
    <button type="button" class="btn btn-outline-secondary" (click)="close(false)">
      Cancelar
    </button>
    <button type="button" class="btn btn-danger" (click)="close(true)">
      Excluir
    </button>
  </div>
</div>
