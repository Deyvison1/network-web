<mat-menu #menu="matMenu">
  <button mat-menu-item (click)="openProfile()">
    <mat-icon>account_circle</mat-icon>
    <span>Perfil</span>
  </button>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>

<mat-sidenav-container class="sidenav-container">
  <mat-sidenav #drawer mode="over" class="sidenav">
    <div class="sidenav-brand">
      <span class="brand-mark">SN</span>
      <div>
        <strong>{{ nameApplication }}</strong>
        <small>Painel administrativo</small>
      </div>
    </div>

    @if (isLoggedIn) {
      <nav class="sidenav-nav">
        @for (item of menuItems; track item.path) {
          <a
            class="sidenav-link"
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [matTooltip]="item.tooltip"
            (click)="closeDrawer()"
          >
            <mat-icon>{{ item.icon }}</mat-icon>
            <span>{{ item.label }}</span>
          </a>
        }
      </nav>
    }
  </mat-sidenav>

  <mat-sidenav-content>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="topbar-left">
          @if (isLoggedIn) {
            <button
              mat-icon-button
              class="menu-button"
              aria-label="Abrir menu"
              (click)="drawer.toggle()"
            >
              <mat-icon>menu</mat-icon>
            </button>
          }

          <a class="brand" routerLink="/home">
            <span class="brand-mark">SN</span>
            <span class="brand-name">{{ nameApplication }}</span>
          </a>
        </div>

        <div class="topbar-actions">
          @if (!isLoggedIn) {
            <button mat-flat-button color="primary" class="login-button" (click)="login()">
              <mat-icon>login</mat-icon>
              <span>Entrar</span>
            </button>
          } @else {
            <a mat-stroked-button class="admin-button" routerLink="/product">
              <mat-icon>admin_panel_settings</mat-icon>
              <span>Área admin</span>
            </a>

            <button mat-flat-button class="profile-button" [matMenuTriggerFor]="menu">
              <mat-icon>person</mat-icon>
              {{ userName | titlecase }}
            </button>
          }
        </div>
      </div>
    </header>

    <main class="main-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
