<mat-card class="admin-card">
  <mat-card-content>
    <div class="admin-card__header">
      <h2>Filtrar categorias</h2>
      <div class="admin-card__actions">
        <button type="button" class="btn btn-warning" (click)="clear()">Limpar</button>
        <button type="submit" class="btn btn-success" form="category-filter-form">Pesquisar</button>
      </div>
    </div>

    <form id="category-filter-form" class="admin-form" [formGroup]="form" (ngSubmit)="search()">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="admin-label" for="category-name">Nome</label>
          <input
            id="category-name"
            type="text"
            class="form-control"
            formControlName="name"
            placeholder="Informe o nome"
          />
        </div>
        <div class="col-md-6">
          <label class="admin-label" for="category-description">Descrição</label>
          <input
            id="category-description"
            type="text"
            class="form-control"
            formControlName="description"
            placeholder="Informe a descrição"
          />
        </div>
      </div>
    </form>
  </mat-card-content>
</mat-card>
