<section class="admin-page">
  <header class="admin-page__header">
    <div>
      <span class="admin-page__kicker">Administração</span>
      <h1>Categorias</h1>
      <p>Organize os grupos dos planos de internet.</p>
    </div>

     <div class="admin-card__actions">
      <button type="submit" class="btn btn-primary" form="product-filter-form" (click)="openNewCategory()">
        <mat-icon>add</mat-icon>
      </button>
    </div>
  </header>

  <app-category-filter (searchEvent)="search($event)" (clearEvent)="clear()"></app-category-filter>
  <app-category-list
    [totalItens]="totalItens"
    [dataSource]="dataSource"
    (refreshDataSource)="refreshDataSource($event)"
    (openDialogCategory)="openDialogCategory($event)"
    (deleteCategory)="openDialogDeleteCategory($event)"
  ></app-category-list>
</section>
