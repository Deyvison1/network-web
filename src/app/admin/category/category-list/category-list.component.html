<mat-card class="admin-card">
  <mat-card-content>
    <div class="admin-card__header">
      <h2>Lista de categorias</h2>
      <button
        type="button"
        *appAuthRole="['ADMIN']"
        class="btn-icon"
        matTooltip="Nova categoria"
        (click)="openForm(ActionType.INSERT)"
      >
        <i class="fa-solid fa-plus"></i>
      </button>
    </div>

    <div class="table-wrap">
      <table
        mat-table
        class="admin-table"
        [dataSource]="dataSource()"
        matSort
        (matSortChange)="changeSortBy($event)"
      >
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Nome</th>
          <td mat-cell *matCellDef="let element">{{ element.name }}</td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Descrição</th>
          <td mat-cell *matCellDef="let element">{{ element.description }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let element">
            <div class="table-actions">
              <button
                type="button"
                [appAuthRole]="['ADMIN']"
                class="btn btn-secondary"
                matTooltip="Editar categoria"
                (click)="openForm(ActionType.EDIT, element)"
              >
                <i class="fa-regular fa-pen-to-square"></i>
              </button>
              <button
                type="button"
                [appAuthRole]="['ADMIN']"
                class="btn btn-danger"
                matTooltip="Excluir categoria"
                (click)="deleteCategory.emit(element.id)"
              >
                <i class="fa-regular fa-trash-can"></i>
              </button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        <tr class="mat-row empty-row" *matNoDataRow>
          <td [attr.colspan]="displayedColumns.length">Nenhuma categoria encontrada.</td>
        </tr>
      </table>
    </div>

    <mat-paginator
      [length]="totalItens()"
      [pageSizeOptions]="[5, 10, 20, 50]"
      (page)="changePage()"
    ></mat-paginator>
  </mat-card-content>
</mat-card>
