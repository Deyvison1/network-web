<app-drag-and-drop [title]="title" (closedDialog)="close()"></app-drag-and-drop>

<form class="admin-form" [formGroup]="form" (ngSubmit)="save()">
  <div class="mb-3">
    <label class="admin-label" for="name">Nome</label>
    <input id="name" type="text" class="form-control" formControlName="name" placeholder="Nome da categoria" />
    <app-erro [setControl]="form.get('name')"></app-erro>
  </div>

  <div class="mb-3">
    <label class="admin-label" for="description">Descrição</label>
    <textarea id="description" class="form-control" formControlName="description" rows="4"></textarea>
    <app-erro [setControl]="form.get('description')"></app-erro>
  </div>

  <div class="form-actions">
    <button type="button" class="btn btn-outline-secondary" (click)="close()">Cancelar</button>
    <button type="submit" class="btn btn-success" [disabled]="form.invalid">Salvar</button>
  </div>
</form>
